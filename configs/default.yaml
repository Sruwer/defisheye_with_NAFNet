input:
  width: 1920
  height: 1536

camera:
  model: equalarea
  cx: 960.0
  cy: 580.0
  radius_x: 810.0
  radius_y: 810.0
  fisheye_fov_deg: 190.0
  distortion: [0.0, 0.0, 0.0, 0.0]

# Projection and panorama lookup tables are generated on the first run and
# reused for every image with the same calibration and geometry settings.
geometry_cache:
  enabled: true
  directory: .cache/geometry

projection:
  width: 960
  height: 720
  hfov_deg: 90.0
  vfov_deg: 85.0
  interpolation: lanczos
  views:
    - {yaw: -50.0, pitch: -6.0, roll: 0.0}
    - {yaw: 0.0, pitch: -6.0, roll: 0.0}
    - {yaw: 50.0, pitch: -6.0, roll: 0.0}

restoration:
  enabled: false
  type: nafnet
  weights: weights/NAFNet-REDS-width64.pth
  architecture_module: third_party.NAFNet.basicsr.models.archs.NAFNet_arch
  architecture_class: NAFNet
  device: cuda
  fp16: true
  width: 64
  enc_blk_nums: [1, 1, 1, 28]
  middle_blk_num: 1
  dec_blk_nums: [1, 1, 1, 1]

stitching:
  backend: known_geometry
  projection: equirectangular
  panorama_width: 1996
  panorama_height: 720

  # Keep the large angular overlap, but assign every panorama pixel to the
  # perspective view whose optical axis is closest to that ray.
  ownership: nearest_axis
  seam:
    method: graphcut
    search_band_deg: 4.0
    feather_px: 20

  # Do not select NAFNet output near a panel border when another view has a
  # valid interior sample. Border pixels remain usable at panorama boundaries.
  border_margin_px: 32
  blend: multiband
  blend_levels: 4

output:
  save_debug: true
  save_raw_views: true
  save_restored_views: true
