[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fisheye-panorama"
version = "0.1.0"
description = "Modular fisheye projection, restoration, and panorama stitching pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
nafnet = ["torch>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

